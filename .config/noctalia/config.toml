[audio]
enable_sounds = true
sound_volume = 0.99999997764825821

[bar.default]
center = [ "clock", "cpu", "ram" ]
concave_edge_corners = false
end = [
    "control-center",
    "group:g1",
    "tray",
    "recorder",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "session"
]
margin_edge = 3
margin_ends = 0
radius = 20
start = [ "launcher", "mpvpaper", "wallhaven", "wallpaper", "workspaces", "active_window" ]

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "media", "audio_visualizer" ]
    opacity = 1.0
    padding = 6.0

[dock]
background_opacity = 0.99999997764825821
concave_edge_corners = false
cross_axis_padding = 0
enabled = true
icon_size = 48
item_spacing = 0
launcher_custom_image_colorize = true
launcher_position = "start"
main_axis_padding = 15
margin_edge = 10
pinned = [
    "kitty",
    "thunar",
    "zen",
    "steam",
    "vesktop",
    "heroic",
    "com.obsproject.Studio",
    "prism_launcher",
    "spotify",
    "org.videolan.VLC",
    "trash"
]
radius = 24
reserve_space = false
show_dots = true
smart_auto_hide = true

[hot_corners.top_left]
action = "launcher"

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.33999999240040779
tint_intensity = 0.42999999038875103
wallpaper = "~/.local/share/backgrounds/linuxmintarch.png"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@HDMI-A-2",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 540.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 86.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "clock"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 0.0
    box_width = 0.0
    cx = 1741.0
    cy = 996.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "media_player"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 128.0
    box_width = 304.0
    cx = 1740.0
    cy = 848.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        bands = 32
        show_when_idle = true

[plugin_settings."noctalia/mpvpaper"]
video_directory = "~/Documents/backgrounds"

[plugins]
enabled = [
    "noctalia/kaomoji",
    "noctalia/screen_recorder",
    "noctalia/mpvpaper",
    "noctalia/wallhaven",
    "radimous/prismlauncher-instances"
]

[shell]
external_ip_enabled = true
font_family = "MesloLGLDZ Nerd Font"
password_style = "random"
polkit_agent = true
settings_show_advanced = true

    [shell.launcher]
    app_grid = true
    sort_by_usage = false

    [shell.panel]
    launcher_position = "center"

    [shell.screen_corners]
    size = 31

[theme]
builtin = "Eldritch"
community_palette = "Breeze"
mode = "dark"
source = "community"
wallpaper_scheme = "muted"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]
    community_ids = [
        "spicetify",
        "pywalfox",
        "zen-browser",
        "zed",
        "rofi",
        "discord",
        "heroiclauncher",
        "obs",
        "opencode",
        "papirus-icons",
        "prismlauncher",
        "steam"
    ]

[wallpaper]
directory = "~/.local/share/backgrounds"
transition = [ "wipe" ]
transition_on_startup = true

    [wallpaper.automation]
    enabled = false
    interval_seconds = 120
    order = "alphabetical"

    [wallpaper.default]
    path = "/home/mscott/.local/share/backgrounds/linuxmintarch.png"

    [wallpaper.last]
    path = "/home/mscott/.local/share/backgrounds/linuxmintarch.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/mscott/.local/share/backgrounds/linuxmintarch.png"

    [wallpaper.monitors.HDMI-A-2]
    path = "/home/mscott/Documents/StaticWallpapers/gimme-your-cutest-pomni-pics-v0-s0pvjqj7izlf1.png"

    [[wallpaper.favorite]]
    path = "/home/mscott/.local/share/backgrounds/Pomni1.jpg"
    theme_mode = "auto"

    [[wallpaper.favorite]]
    community_palette = "Osaka jade"
    palette_source = "community"
    path = "/home/mscott/.local/share/backgrounds/linuxmintarch.png"
    theme_mode = "dark"

[widget.clock]
enabled = true
format = "{:%a} {:%d.%m.%Y} {:%-I:%M %p}"

[widget.control-center]
custom_image = "/usr/share/noctalia/assets/images/distros/arch.svg"
enabled = true
glyph = "brand-apple-filled"

[widget.date]
enabled = true

[widget.media]
enabled = true

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

[widget.network]
enabled = true

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.session]
enabled = true

[widget.tray]
enabled = true

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.workspaces]
enabled = true
