# Appearance
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 3
    col.active_border = rgb(f7f700)
    col.inactive_border = rgb(f5e0a0)
    resize_on_border = true
}

decoration {
    rounding = 20
    rounding_power = 2
    
shadow {
 enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
}

blur {
    enabled = true
    size = 3
    passes = 2
    vibrancy = 0.1696
}
}

animations {
    enabled = yes
    bezier = easeOutCubic, 0.25, 0.46, 0.45, 0.94
    animation = windows, 1, 4, easeOutCubic, gnomed
    animation = windowsOut, 1, 4, easeOutCubic, gnomed
}

# VRR
misc {
    vrr = 2
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
# Monitor config
monitor = HDMI-A-2, 1920x1080@120, 0x0, 1
monitor = HDMI-A-1, 1920x1080@120, 1920x0, 1
#Env
env = QT_QPA_PLATFORMTHEME,qt6ct
env = TERMINAL,kitty
env = GTK_CSD,0
env = XCURSOR_THEME,MacOS-Tahoe-Cursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,MacOS-Tahoe-Cursor
env = HYPRCURSOR_SIZE,24
# Autostart
exec-once = openrgb --profile RGB
exec-once = noctalia
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = uwsm app -- steam
exec-once = flatpak run dev.vencord.Vesktop
$mainMod = SUPER
$terminal = kitty
$fileManager = nemo
$menu = noctalia msg panel-toggle launcher
$browser = google-chrome-stable
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, M, exec, hyprshutdown
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy
bind = $mainMod, R, exec, $menu
bind = $mainMod, F, fullscreen
bind = $mainMod, B, exec, $browser --new-window
bind = $mainMod, W, exec, /bin/bash -c 'pkill swaybg; pkill mpvpaper; pkill hyprpaper; ~/.local/share/scripts/multimonwallpapers.sh'
bind = $mainMod, P, exec, hyprpicker -a -n
bind = $mainMod, X, togglefloating

# Media keys
bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase
bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease
bindl = , XF86AudioMute, exec, $ipc volume muteOutput
bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase
bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease

# Pin workspaces to monitors
workspace = 1, monitor:HDMI-A-2, persistent:true
workspace = 2, monitor:HDMI-A-2, persistent:true
workspace = 3, monitor:HDMI-A-2, persistent:true
workspace = 4, monitor:HDMI-A-2, persistent:true
workspace = 5, monitor:HDMI-A-2, persistent:true
workspace = 6, monitor:HDMI-A-1, persistent:true
workspace = 7, monitor:HDMI-A-1, persistent:true
workspace = 8, monitor:HDMI-A-1, persistent:true
workspace = 9, monitor:HDMI-A-1, persistent:true
workspace = 10, monitor:HDMI-A-1, persistent:true

# Workspace switching
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move windows to workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10


# Move windows in tiling layout
bind = $mainMod, left, movewindow, l
bind = $mainMod, down, movewindow, d
bind = $mainMod, up, movewindow, u
bind = $mainMod, right, movewindow, r

# Screenshots (hyprshot)
bind = , Print, exec, hyprshot -m region
bind = SHIFT, Print, exec, hyprshot -m output
bind = $mainMod, Print, exec, hyprshot -m window

# Volume
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume --limit 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# Lock Screen
bind = $mainMod, L, exec, noctalia msg session-lock

# HyprEmoji config
source = ~/.config/hypremoji/hypremoji.conf

# For Noctalia Color templates
source = ~/.config/hypr/noctalia.conf
